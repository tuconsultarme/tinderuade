<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="UADencuentros — conocé gente de UADE para salir, hacer amigos o estudiar juntos." />

    <!-- App-shell en iOS cuando se agrega a la pantalla de inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UADencuentros" />

    <link rel="icon" type="image/svg+xml" href="/marca/isotipo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>UADencuentros</title>

    <!-- Aplica el tema guardado antes de pintar, para que no parpadee. -->
    <script>
      document.documentElement.dataset.tema =
        localStorage.getItem('tema') === 'claro' ? 'light' : 'dark'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
